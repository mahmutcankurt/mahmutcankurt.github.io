<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Mahmut Can Kurt</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1117">
  <script>
    (function () {
      var t = 'dark';
      try { var s = localStorage.getItem('theme'); if (s === 'dark' || s === 'light') t = s; else if (matchMedia('(prefers-color-scheme: light)').matches) t = 'light'; } catch (e) { }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
    .nf .window { max-width: 560px; margin: 0 auto; }
    .nf .code { white-space: pre-wrap; }
    .nf .cta { padding: 0 20px 20px; }
  </style>
</head>

<body>
  <main class="nf">
    <div class="container">
      <div class="window">
        <div class="window-bar"><span class="dot r1"></span><span class="dot y1"></span><span class="dot g1"></span><span class="window-title">~/404</span></div>
<pre class="code"><span class="g">$</span> cd <span class="f">"<span id="path">/this-page</span>"</span>
<span class="r">bash: cd: No such file or directory</span>
<span class="g">$</span> echo $?
<span class="n">404</span></pre>
        <div class="cta">
          <a class="btn btn-primary" href="/">cd ~</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('path').textContent = location.pathname.replace(/^\//, '').slice(0, 40) || 'this-page';
  </script>
</body>

</html>
